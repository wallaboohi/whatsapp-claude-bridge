<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת המערכת</title>
<link rel="stylesheet" href="heebo.css">
<link rel="stylesheet" href="style.css">
<style>
/* system map (owner 10.11 / 11.11): engine shared by both PCs, project data per conversation, data, connections */
body { margin: 0; background: var(--bg); color: var(--text); font-family: Heebo, system-ui, sans-serif; }
.map { position: relative; display: grid; grid-template-columns: 1.15fr 1fr 1fr .9fr 1.05fr; gap: 22px; padding: 18px 20px 24px; }
.lane h3 { margin: 0 0 8px; font-size: .95rem; color: var(--muted); font-weight: 700; }
.lane h3 small { font-weight: 400; }
.node { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
  margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.node.click { cursor: pointer; } .node.click:hover { border-color: var(--brand); }
.node b { font-size: .92rem; } .node .what { font-size: .78rem; color: var(--muted); margin-top: 2px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-start: 6px; vertical-align: middle; background: #b8c2cc; }
.dot.ok { background: #25a35a; } .dot.bad { background: #d9453b; } .dot.wait { background: #e8a33d; } .dot.plan { background: #8c9bab; }
.machine { border-width: 2px; } .machine.self { border-color: var(--brand); }
.convs { margin: 8px 0 0; display: flex; flex-direction: column; gap: 5px; }
.conv { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: .8rem; padding: 4px 8px;
  background: var(--surface-2); border-radius: 8px; cursor: pointer; }
.conv:hover { outline: 1px solid var(--brand); }
.conv .r { font-size: .74rem; color: var(--info); white-space: nowrap; }
.engine { border-color: var(--violet); border-width: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tool { font-size: .72rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 1px 7px; direction: ltr; }
.warn { border-color: #e8a33d; background: color-mix(in srgb, #e8a33d 8%, var(--surface)); font-size: .8rem; }
svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
svg.wires path { fill: none; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.6; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 20px 0; }
.top h2 { margin: 0; font-size: 1.15rem; } .top .note { font-size: .8rem; color: var(--muted); }
.legend { font-size: .75rem; color: var(--muted); padding: 0 20px; }
.ai { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; }
.ai .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.ai select, .ai input { font: inherit; font-size: .78rem; padding: 3px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--text); min-width: 0; }
.ai button { font: inherit; font-size: .76rem; padding: 3px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); cursor: pointer; }
.ai button:hover { border-color: var(--brand); }
.ai .box { font-size: .76rem; margin-top: 6px; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; }
.ai .box a { color: var(--brand); word-break: break-all; }
</style>
</head>
<body>
<div class="top"><h2>🗺️ מפת המערכת</h2><span class="note" id="at"></span></div>
<p class="legend">המנוע (יכולות, שיטות וכלים) נשמר בגשר ומשותף לשני המחשבים · המידע של כל פרויקט נשמר בשיחה שלו · לחיצה על שיחה פותחת אותה, על 📜 את כללי הבסיס, על מאגר את התיקייה.</p>
<div class="map" id="map"><svg class="wires" id="wires"></svg></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dot = st => `<span class="dot ${st}"></span>`;
const PURPOSE = { "4m": "פרויקט", dev: "פיתוח הגשר", guest: "אורח", general: "כללי", local: "מקומית" };
const post = msg => { try { parent.postMessage(Object.assign({ from: "system-map" }, msg), "*"); } catch (e) {} };

async function draw() {
  $("map").innerHTML = '<svg class="wires" id="wires"></svg>';
  const m = await (await fetch("/system_map")).json();
  if (m.error) { $("map").insertAdjacentHTML("beforeend", `<p>${esc(m.error)}</p>`); return; }
  $("at").textContent = "עודכן " + new Date(m.at).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
  const machines = m.machines.map((x, i) => `
    <div class="node machine ${x.self ? "self" : ""}" data-wire="m${i}">
      <b>${x.self ? "🖥️" : "💻"} ${esc(x.name)}</b>${dot(x.online ? "ok" : "bad")}
      <div class="what">גשר ${dot(x.bridge ? "ok" : "bad")} ${esc(x.bridge_version)} · סוכן ${dot(x.agent ? "ok" : "bad")} · לוח ${esc(x.dash_version)} · קוד ${esc(x.git)}${x.dirty ? " ✎" : ""}</div>
      ${aiBlock(x, i, m)}
      <div class="convs">${x.conversations.map(c => `
        <div class="conv" data-jid="${esc(c.jid)}" data-peer="${x.self ? "" : i - 1}"><span>💬 ${esc(c.name)} <small>· ${esc(PURPOSE[c.purpose] || c.purpose)}</small></span>
          <span class="r" data-rules="1">📜 כללים</span></div>`).join("")}</div>
    </div>`).join("");
  const engine = `
    <div class="node engine" data-wire="engine"><b>⚙️ המנוע (הגשר)</b>
      <div class="what">משותף לשני המחשבים · מאגר הקוד hub · עדכון אוטומטי 23:50</div></div>
    <div class="node" data-wire="e1"><b>📡 גשר ווצאפ (Go)</b><div class="what">חיבור לווצאפ, הודעות, מדיה, טיוטות, מחובר/מקליד</div></div>
    <div class="node" data-wire="e2"><b>🤖 הסוכן (Python)</b><div class="what">Claude לכל שיחה, תמלול, תזמונים, גיבוי, סנכרון</div></div>
    <div class="node" data-wire="e3"><b>🪟 לוח הבקרה</b><div class="what">שיחות, מודל, הגדרות, המפה הזו</div></div>
    <div class="node" data-wire="e4"><b>🧰 כלים</b><div class="tools">${m.tools.map(t => `<span class="tool" title="${esc(t.what)}">${esc(t.name.replace(/\.py$/, ""))}</span>`).join("")}</div></div>`;
  const data = m.data.map((d, i) => `
    <div class="node ${d.exists ? "click" : ""}" data-wire="d${i}" ${d.exists ? `data-path="${esc(d.path)}"` : ""}>
      <b>🗄️ ${esc(d.name)}</b>${dot(d.path ? (d.exists ? "ok" : "bad") : "plan")}<div class="what">${esc(d.what)}</div></div>`).join("");
  const links = m.links.map((l, i) => `
    <div class="node" data-wire="l${i}"><b>🔌 ${esc(l.name)}</b>${dot(l.state)}<div class="what">${esc(l.detail)}</div></div>`).join("")
    + (m.overlaps.length ? `<h3 style="margin-top:16px">⚠️ לסידור <small>(כפילויות / פיצול)</small></h3>` + m.overlaps.map(o => `<div class="node warn">${esc(o)}</div>`).join("") : "");
  $("map").insertAdjacentHTML("beforeend", `
    <div class="lane"><h3>מחשבים ושיחות <small>(המידע של כל פרויקט)</small></h3>${machines}</div>
    <div class="lane"><h3>מנוע <small>(יכולות, שיטות וכלים)</small></h3>${engine}</div>
    <div class="lane"><h3>מידע ומאגרים</h3>${data}</div>
    <div class="lane"><h3>חיבורים</h3>${links}</div>
    <div class="lane"><h3>בינות <small>(מי חושב, ואיפה)</small></h3>${aiLane(m.ai)}</div>`);
  wireAi();
  document.querySelectorAll(".conv").forEach(el => el.onclick = e => post({ open: el.dataset.jid, peer: el.dataset.peer, rules: !!e.target.closest("[data-rules]") }));
  document.querySelectorAll("[data-path]").forEach(el => el.onclick = () =>
    fetch("/action", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ do: "open_path", path: el.dataset.path }) }));
  wires(m);
}

const peerBase = i => i === 0 ? "" : "/peer/" + (i - 1);  // the first machine is this one
async function machineAct(i, body) {
  try { return await (await fetch(peerBase(i) + "/action", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json(); }
  catch (e) { return { error: "המחשב לא מגיב" }; }
}
function aiBlock(x, i, m) {  // owner 14.11: which Claude account and which AI run on this computer, and the way to change them
  const a = x.ai || {}, c = a.claude || {};
  const acct = c.email ? `<b>${esc(c.email)}</b> · ${esc(c.plan || "")}${c.org ? " · " + esc(c.org) : ""}` : (c.logged_in === false ? "<b>לא מחובר</b>" : "לא ידוע (המחשב עוד לא עודכן)");
  const opts = ((m.ai || {}).providers || []).map(p => `<option value="${esc(p.id)}" ${p.id === a.provider ? "selected" : ""}>${p.where === "local" ? "🏠" : "☁️"} ${esc(p.label)}</option>`).join("");
  return `<div class="ai" data-m="${i}">
    <div class="what">🔑 חשבון Claude: ${acct}${x.account ? ` <small>(${esc(x.account)})</small>` : ""}</div>
    <div class="what">🧠 ספק פעיל: ${a.where === "local" ? "🏠" : "☁️"} <b>${esc(a.short || "—")}</b> · ${esc(a.model || "")}</div>
    <div class="row"><select class="pick">${opts}</select><button class="swap">החלף ספק</button><button class="acct">החלף חשבון Claude</button></div>
    <div class="box" hidden></div></div>`;
}
function wireAi() {
  document.querySelectorAll(".ai").forEach(el => {
    const i = +el.dataset.m, box = el.querySelector(".box"), say = h => { box.hidden = false; box.innerHTML = h; };
    el.querySelector(".swap").onclick = async () => {
      say("מחליף…"); const r = await machineAct(i, { do: "provider_set", provider: el.querySelector(".pick").value, model: "" });
      if (r.error) say("⚠️ " + esc(r.error)); else { say("✅ הספק הוחלף, תקף מההודעה הבאה"); setTimeout(draw, 1500); }
    };
    el.querySelector(".acct").onclick = async () => {
      if (!confirm("להתחבר ל-Claude עם חשבון אחר במחשב הזה? זה משפיע על כל השיחות שרצות עליו.")) return;
      say("מכין קישור התחברות…"); const r = await machineAct(i, { do: "claude_login_start" });
      if (r.error) return say("⚠️ " + esc(r.error));
      say(`1. פתח את הקישור והתחבר עם החשבון הרצוי:<br><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.slice(0, 70))}…</a><br>2. הדבק כאן את הקוד שמוצג:
        <div class="row"><input class="code" placeholder="הקוד" dir="ltr"><button class="send">אשר</button></div>`);
      box.querySelector(".send").onclick = async () => {
        const v = box.querySelector(".code").value; say("בודק…");
        const r2 = await machineAct(i, { do: "claude_login_code", code: v });
        if (r2.error) say("⚠️ " + esc(r2.error)); else { say(`✅ מחובר עכשיו: <b>${esc(r2.account.email)}</b> · ${esc(r2.account.plan)}`); setTimeout(draw, 2500); }
      };
    };
  });
}

function aiLane(a) {  // owner 14.11: local (on the owner's own computers) vs remote (cloud): the place decides the response time
  if (!a) return "";
  const cur = a.providers.find(p => p.active) || {};
  const row = p => `<div class="node"><b>${p.where === "local" ? "🏠" : "☁️"} ${esc(p.label)}</b>${dot(p.ready ? "ok" : (p.key === false ? "wait" : "bad"))}
      <div class="what">${esc(p.cost)}${p.key === false ? " · חסר מפתח" : ""}${p.active ? " · ✅ פעיל" : ""}</div></div>`;
  return `<div class="node engine"><b>🧠 עונה עכשיו: ${esc(cur.label || a.active)}</b>
      <div class="what">${esc(a.model)} · ${cur.where === "local" ? "🏠 מקומי, על המחשבים שלך: זמן התגובה לפי החומרה" : "☁️ מרוחק: זמן התגובה לפי הרשת והספק"}</div></div>
    <h3 style="margin-top:12px">🏠 מקומי <small>(על המחשבים שלך)</small></h3>
    ${a.local_hosts.map(h => `<div class="node"><b>💻 ${esc(h.label.split("(")[0].trim())}</b>${dot(h.up ? "ok" : "bad")}
      <div class="what">${h.up ? h.models + " מודלים" : "לא מגיב"} · איטי על מעבד, מהיר יותר עם כרטיס מסך</div></div>`).join("")}
    ${a.providers.filter(p => p.where === "local").map(row).join("")}
    <h3 style="margin-top:12px">☁️ מרוחק <small>(אצל הספק)</small></h3>
    ${a.providers.filter(p => p.where === "remote" && p.id !== "auto").map(row).join("")}
    <div class="node"><b>🔁 שרת תרגום (פורט 8799)</b>${dot(a.translator ? "ok" : "bad")}<div class="what">מתרגם בין הגשר לספקים שמדברים בפורמט OpenAI</div></div>
    <div class="node"><b>⚖️ /אוטו, מהזול ליקר</b><div class="what">${a.ladder.map(esc).join(" ← ")}</div></div>`;
}

function wires(m) {  // machines -> engine -> each part; engine parts -> data and connections
  const svg = $("wires"), box = $("map").getBoundingClientRect();
  const at = (k, side) => { const el = document.querySelector(`[data-wire="${k}"]`); if (!el) return null;
    const r = el.getBoundingClientRect(); return { x: (side === "r" ? r.right : r.left) - box.left, y: r.top + r.height / 2 - box.top }; };
  const line = (a, b) => a && b ? `<path d="M${a.x},${a.y} C${(a.x + b.x) / 2},${a.y} ${(a.x + b.x) / 2},${b.y} ${b.x},${b.y}"/>` : "";
  let p = "";
  m.machines.forEach((_, i) => p += line(at(`m${i}`, "l"), at("engine", "r")));
  ["e1", "e2", "e3", "e4"].forEach(k => p += line(at("engine", "r"), at(k, "r")));
  m.data.forEach((_, i) => p += line(at(i < 3 ? "e1" : "e2", "l"), at(`d${i}`, "r")));
  m.links.forEach((_, i) => p += line(at(`d${Math.min(i, m.data.length - 1)}`, "l"), at(`l${i}`, "r")));
  svg.innerHTML = p;
}
draw();
addEventListener("resize", () => fetch("/system_map").then(r => r.json()).then(wires));
</script>
</body>
</html>
